<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact the StudyBridge team with questions, suggestions or resource ideas.">
  <title>Contact | StudyBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">StudyBridge</a>
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav id="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="study-tips.html">Study Tips</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="planner.html">Planner</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content">
    <h1>Contact us</h1>
    <p>Send a question, suggestion or a resource idea. Please do not enter passwords or private details.</p>

    <form id="contact-form" novalidate>
      <label for="name">Your name</label>
      <input type="text" id="name" autocomplete="name">
      <p class="error" id="name-error" aria-live="polite"></p>

      <label for="email">Email address</label>
      <input type="email" id="email" autocomplete="email">
      <p class="error" id="email-error" aria-live="polite"></p>

      <label for="topic">Topic</label>
      <select id="topic">
        <option value="">Choose a topic</option>
        <option value="question">Study question</option>
        <option value="resource">Suggest a resource</option>
        <option value="feedback">Website feedback</option>
        <option value="other">Other</option>
      </select>
      <p class="error" id="topic-error" aria-live="polite"></p>

      <label for="message">Message</label>
      <textarea id="message" rows="5"></textarea>
      <p class="error" id="message-error" aria-live="polite"></p>

      <p><button class="btn btn-primary" type="submit">Send message</button></p>
      <div class="success" id="form-success" role="status" hidden></div>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> StudyBridge | IS 1106 Group Web Project</p>
    <p><a href="index.html">Back to home</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
